version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      development-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    ignore:
      # @types/vscode must match the minimum in engines.vscode; raise both
      # together by hand when the supported VS Code range moves.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @types/node stays on the major vitest accepts as a peer (22); the
      # extension host of the minimum engines.vscode runs Node 20 (see
      # CONTRIBUTING). Raise its major by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
