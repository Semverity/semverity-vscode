version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      development-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    ignore:
      # @types/vscode must match the minimum in engines.vscode; raise both
      # together by hand when the supported VS Code range moves.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @types/node tracks the Node.js version of the extension host in the
      # minimum engines.vscode (Node 20 for VS Code 1.100) and the esbuild
      # target; raise its major by hand together with those.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
