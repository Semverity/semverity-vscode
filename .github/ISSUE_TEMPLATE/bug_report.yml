name: Bug report
description: Something in the extension does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please leave out private package names, internal
        registry hosts, file paths and source code; a small public example is
        enough to reproduce most problems.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: The import line or manifest entry that shows the problem (public packages only).
      render: text
  - type: dropdown
    id: ecosystem
    attributes:
      label: Ecosystem
      multiple: true
      options:
        - npm (JavaScript or TypeScript)
        - PyPI (Python)
        - Go modules
        - Not specific to one ecosystem
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version and operating system
      placeholder: "1.105.0 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: |
        Optional. Run "Semverity: Show Log" and paste the relevant lines. The log
        holds package coordinates and API status codes; review it before pasting.
      render: text
